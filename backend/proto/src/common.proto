syntax = "proto3";

package fintech.common.v1;

option go_package = "fintech-backend/proto/gen/common";

// Common account type enum
enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_BANK = 1;
  ACCOUNT_TYPE_CASH = 2;
  ACCOUNT_TYPE_INVESTMENT = 3;
  ACCOUNT_TYPE_CREDIT = 4;
  ACCOUNT_TYPE_SAVINGS = 5;
  ACCOUNT_TYPE_ASSET = 6;
  ACCOUNT_TYPE_LIABILITY = 7;
  ACCOUNT_TYPE_EQUITY = 8;
  ACCOUNT_TYPE_REVENUE = 9;
  ACCOUNT_TYPE_EXPENSE = 10;
  ACCOUNT_TYPE_RECEIVABLE = 11;
  ACCOUNT_TYPE_PAYABLE = 12;
  ACCOUNT_TYPE_LOAN = 13;
  ACCOUNT_TYPE_CAPITAL = 14;
  ACCOUNT_TYPE_RETAINED = 15;
  ACCOUNT_TYPE_INCOME = 16;
  ACCOUNT_TYPE_GAIN = 17;
  ACCOUNT_TYPE_LOSS = 18;
  ACCOUNT_TYPE_FEE = 19;
}

// Common account status enum
enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_INACTIVE = 2;
  ACCOUNT_STATUS_SUSPENDED = 3;
  ACCOUNT_STATUS_CLOSED = 4;
} 