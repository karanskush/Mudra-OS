syntax = "proto3";

package fintech.payment_rail.v1;

option go_package = "fintech-backend/proto/gen/payment_rail";

import "google/protobuf/timestamp.proto";

// PaymentRailService - Select optimal payment rail for transactions
service PaymentRailService {
  // Select optimal payment rail for a transaction
  rpc SelectPaymentRail(SelectRailRequest) returns (SelectRailResponse);
  
  // Get available rails for a route
  rpc GetAvailableRails(GetRailsRequest) returns (GetRailsResponse);
  
  // Get rail performance metrics
  rpc GetRailMetrics(GetRailMetricsRequest) returns (GetRailMetricsResponse);
}

// Payment rail types
enum PaymentRailType {
  PAYMENT_RAIL_TYPE_UNSPECIFIED = 0;
  PAYMENT_RAIL_TYPE_UPI = 1;
  PAYMENT_RAIL_TYPE_SEPA = 2;
  PAYMENT_RAIL_TYPE_CRYPTO = 3;
  PAYMENT_RAIL_TYPE_ACH = 4;
  PAYMENT_RAIL_TYPE_SWIFT = 5;
  PAYMENT_RAIL_TYPE_PIX = 6;
  PAYMENT_RAIL_TYPE_FASTER_PAYMENTS = 7;
  PAYMENT_RAIL_TYPE_INTERAC = 8;
}

// Rail selection priority
enum SelectionPriority {
  SELECTION_PRIORITY_UNSPECIFIED = 0;
  SELECTION_PRIORITY_SPEED = 1;
  SELECTION_PRIORITY_COST = 2;
  SELECTION_PRIORITY_RELIABILITY = 3;
  SELECTION_PRIORITY_COMPLIANCE = 4;
}

// Rail status
enum RailStatus {
  RAIL_STATUS_UNSPECIFIED = 0;
  RAIL_STATUS_ACTIVE = 1;
  RAIL_STATUS_MAINTENANCE = 2;
  RAIL_STATUS_DEGRADED = 3;
  RAIL_STATUS_OFFLINE = 4;
}

// Select payment rail request
message SelectRailRequest {
  string from_country = 1;
  string to_country = 2;
  double amount = 3;
  string currency = 4;
  SelectionPriority priority = 5;
  bool include_alternatives = 6;
  repeated PaymentRailType excluded_rails = 7;
  map<string, string> metadata = 8;
}

// Select payment rail response
message SelectRailResponse {
  PaymentRailType selected_rail = 1;
  double estimated_fee = 2;
  string estimated_time = 3;
  double fx_rate = 4;
  string reason = 5;
  RailConfig rail_config = 6;
  repeated RailOption alternatives = 7;
  double confidence_score = 8;
  google.protobuf.Timestamp selected_at = 9;
}

// Get available rails request
message GetRailsRequest {
  string from_country = 1;
  string to_country = 2;
  string currency = 3;
  double min_amount = 4;
  double max_amount = 5;
  bool include_inactive = 6;
}

// Get available rails response
message GetRailsResponse {
  repeated RailOption available_rails = 1;
  int32 total_count = 2;
  string route_id = 3;
  google.protobuf.Timestamp cached_at = 4;
}

// Get rail metrics request
message GetRailMetricsRequest {
  PaymentRailType rail_type = 1;
  string time_period = 2;  // "1h", "24h", "7d", "30d"
  bool include_detailed_stats = 3;
}

// Get rail metrics response
message GetRailMetricsResponse {
  PaymentRailType rail_type = 1;
  double success_rate = 2;
  double avg_processing_time = 3;
  double avg_fee = 4;
  int32 total_transactions = 5;
  RailStatus current_status = 6;
  repeated MetricDataPoint metrics = 7;
  google.protobuf.Timestamp metrics_from = 8;
  google.protobuf.Timestamp metrics_to = 9;
}

// Rail configuration
message RailConfig {
  PaymentRailType rail_type = 1;
  double min_amount = 2;
  double max_amount = 3;
  repeated string supported_currencies = 4;
  repeated string supported_countries = 5;
  string processing_time = 6;
  double base_fee = 7;
  double percentage_fee = 8;
  map<string, string> config_params = 9;
}

// Rail option details
message RailOption {
  PaymentRailType rail_type = 1;
  string rail_name = 2;
  double estimated_fee = 3;
  string estimated_time = 4;
  double fx_rate = 5;
  RailStatus status = 6;
  double reliability_score = 7;
  string description = 8;
  repeated string features = 9;
  RailConfig config = 10;
}

// Metrics data point
message MetricDataPoint {
  google.protobuf.Timestamp timestamp = 1;
  double success_rate = 2;
  double avg_processing_time = 3;
  double avg_fee = 4;
  int32 transaction_count = 5;
  RailStatus status = 6;
} 