syntax = "proto3";

package fintech.risk_monitoring.v1;

option go_package = "fintech-backend/proto/gen/risk_monitoring";

import "google/protobuf/timestamp.proto";

// RiskMonitoringService - Real-time risk assessment with dynamic rule updates
service RiskMonitoringService {
  // Bidirectional streaming for real-time risk monitoring
  rpc MonitorRisk(stream RiskCommand) returns (stream RiskEvent);
}

// Risk level enum
enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_LOW = 1;
  RISK_LEVEL_MEDIUM = 2;
  RISK_LEVEL_HIGH = 3;
  RISK_LEVEL_CRITICAL = 4;
}

// Alert severity enum
enum AlertSeverity {
  ALERT_SEVERITY_UNSPECIFIED = 0;
  ALERT_SEVERITY_INFO = 1;
  ALERT_SEVERITY_WARNING = 2;
  ALERT_SEVERITY_CRITICAL = 3;
  ALERT_SEVERITY_URGENT = 4;
}

// Risk command message
message RiskCommand {
  oneof command {
    StartMonitoring start_monitoring = 1;
    UpdateRiskRules update_rules = 2;
    CheckTransaction check_transaction = 3;
    StopMonitoring stop_monitoring = 4;
  }
}

// Risk event message
message RiskEvent {
  oneof event {
    RiskAlert risk_alert = 1;
    RiskScore risk_score = 2;
    RuleUpdate rule_update = 3;
    MonitoringStatus monitoring_status = 4;
  }
}

// Start monitoring request
message StartMonitoring {
  string user_id = 1;
  repeated string account_ids = 2;
  RiskLevel min_risk_level = 3;
  double min_transaction_amount = 4;
  repeated string monitored_countries = 5;
  bool enable_ml_scoring = 6;
  map<string, string> custom_rules = 7;
}

// Update risk rules request
message UpdateRiskRules {
  string rule_id = 1;
  string rule_name = 2;
  string rule_expression = 3;
  RiskLevel threshold_level = 4;
  bool is_active = 5;
  map<string, string> rule_parameters = 6;
}

// Check transaction request
message CheckTransaction {
  string transaction_id = 1;
  string user_id = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  double amount = 5;
  string currency = 6;
  string country = 7;
  map<string, string> metadata = 8;
}

// Stop monitoring request
message StopMonitoring {
  string reason = 1;
}

// Risk alert response
message RiskAlert {
  string alert_id = 1;
  AlertSeverity severity = 2;
  RiskLevel risk_level = 3;
  string transaction_id = 4;
  string user_id = 5;
  string alert_type = 6;
  string description = 7;
  repeated string triggered_rules = 8;
  double risk_score = 9;
  map<string, string> alert_data = 10;
  google.protobuf.Timestamp triggered_at = 11;
  string recommended_action = 12;
}

// Risk score response
message RiskScore {
  string transaction_id = 1;
  double overall_score = 2;
  RiskLevel risk_level = 3;
  map<string, double> factor_scores = 4;
  repeated string risk_factors = 5;
  string scoring_model = 6;
  google.protobuf.Timestamp scored_at = 7;
}

// Rule update response
message RuleUpdate {
  string rule_id = 1;
  string rule_name = 2;
  bool update_success = 3;
  string message = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// Monitoring status response
message MonitoringStatus {
  bool is_active = 1;
  string session_id = 2;
  int32 alerts_count = 3;
  int32 transactions_monitored = 4;
  google.protobuf.Timestamp started_at = 5;
  map<string, int32> rule_trigger_counts = 6;
  string message = 7;
} 