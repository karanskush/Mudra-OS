syntax = "proto3";

package fintech.account_info.v1;

option go_package = "fintech-backend/proto/gen/account_info";

import "google/protobuf/timestamp.proto";
import "common.proto";

// AccountInfoService - Get account details and transaction history
service AccountInfoService {
  // Get account details
  rpc GetAccountInfo(GetAccountInfoRequest) returns (GetAccountInfoResponse);
  
  // Get account summary with balances
  rpc GetAccountSummary(GetAccountSummaryRequest) returns (GetAccountSummaryResponse);
  
  // Stream account transaction history (server streaming)
  rpc StreamTransactionHistory(TransactionHistoryRequest) returns (stream TransactionHistoryResponse);
}

// Transaction type enum
enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_TRANSFER = 1;
  TRANSACTION_TYPE_DEPOSIT = 2;
  TRANSACTION_TYPE_WITHDRAWAL = 3;
  TRANSACTION_TYPE_PAYMENT = 4;
  TRANSACTION_TYPE_REFUND = 5;
  TRANSACTION_TYPE_FEE = 6;
  TRANSACTION_TYPE_ADJUSTMENT = 7;
}

// Get account info request
message GetAccountInfoRequest {
  string account_id = 1;
  bool include_balance = 2;
  bool include_recent_transactions = 3;
  int32 recent_transaction_limit = 4;
}

// Get account info response
message GetAccountInfoResponse {
  LedgerAccount account = 1;
  double current_balance = 2;
  repeated Transaction recent_transactions = 3;
  AccountMetrics metrics = 4;
}

// Get account summary request
message GetAccountSummaryRequest {
  string user_id = 1;
  repeated string account_ids = 2;
  bool include_sub_accounts = 3;
}

// Get account summary response
message GetAccountSummaryResponse {
  repeated AccountSummary accounts = 1;
  double total_balance = 2;
  string base_currency = 3;
  int32 total_accounts = 4;
  google.protobuf.Timestamp summary_at = 5;
}

// Transaction history request
message TransactionHistoryRequest {
  string account_id = 1;
  google.protobuf.Timestamp from_date = 2;
  google.protobuf.Timestamp to_date = 3;
  int32 limit = 4;
  int32 offset = 5;
  repeated TransactionType transaction_types = 6;
  double min_amount = 7;
  double max_amount = 8;
  bool include_pending = 9;
}

// Transaction history response
message TransactionHistoryResponse {
  Transaction transaction = 1;
  bool is_last = 2;
  int32 total_count = 3;
  int32 current_index = 4;
}

// Ledger account details
message LedgerAccount {
  string account_id = 1;
  string user_id = 2;
  string account_number = 3;
  string name = 4;
  string description = 5;
  fintech.common.v1.AccountType type = 6;
  fintech.common.v1.AccountStatus status = 7;
  string currency = 8;
  string parent_id = 9;
  bool is_system = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// Transaction details
message Transaction {
  string transaction_id = 1;
  string user_id = 2;
  TransactionType type = 3;
  string description = 4;
  string reference = 5;
  double total_amount = 6;
  string currency = 7;
  string status = 8;
  google.protobuf.Timestamp timestamp = 9;
  repeated LedgerEntry entries = 10;
}

// Ledger entry details
message LedgerEntry {
  string entry_id = 1;
  string transaction_id = 2;
  string debit_account_id = 3;
  string credit_account_id = 4;
  double amount = 5;
  string currency = 6;
  string entry_type = 7;
  string description = 8;
  string reference = 9;
  google.protobuf.Timestamp timestamp = 10;
}

// Account summary
message AccountSummary {
  string account_id = 1;
  string account_name = 2;
  fintech.common.v1.AccountType account_type = 3;
  double current_balance = 4;
  double available_balance = 5;
  double pending_balance = 6;
  string currency = 7;
  fintech.common.v1.AccountStatus status = 8;
  google.protobuf.Timestamp last_activity = 9;
}

// Account metrics
message AccountMetrics {
  int32 total_transactions = 1;
  double total_debits = 2;
  double total_credits = 3;
  double avg_transaction_amount = 4;
  google.protobuf.Timestamp first_transaction = 5;
  google.protobuf.Timestamp last_transaction = 6;
  map<string, int32> transaction_type_counts = 7;
} 