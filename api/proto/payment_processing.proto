syntax = "proto3";

package fintech.payment_processing.v1;

option go_package = "fintech-api/proto/gen/payment_processing";

import "google/protobuf/timestamp.proto";

// PaymentProcessingService - Real-time payment processing with status updates
service PaymentProcessingService {
  // Bidirectional streaming for real-time payment processing
  rpc ProcessPayments(stream PaymentRequest) returns (stream PaymentResponse);
}

// Payment status enum
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_INITIATED = 1;
  PAYMENT_STATUS_PROCESSING = 2;
  PAYMENT_STATUS_COMPLETED = 3;
  PAYMENT_STATUS_FAILED = 4;
  PAYMENT_STATUS_CANCELLED = 5;
}

// Payment rail types
enum PaymentRail {
  PAYMENT_RAIL_UNSPECIFIED = 0;
  PAYMENT_RAIL_UPI = 1;
  PAYMENT_RAIL_SEPA = 2;
  PAYMENT_RAIL_CRYPTO = 3;
  PAYMENT_RAIL_ACH = 4;
  PAYMENT_RAIL_SWIFT = 5;
  PAYMENT_RAIL_PIX = 6;
  PAYMENT_RAIL_FASTER_PAYMENTS = 7;
}

// Payment processing request message
message PaymentRequest {
  oneof request {
    InitiatePayment initiate_payment = 1;
    UpdatePayment update_payment = 2;
    CancelPayment cancel_payment = 3;
    GetPaymentStatus get_status = 4;
  }
}

// Payment processing response message
message PaymentResponse {
  oneof response {
    PaymentInitiated payment_initiated = 1;
    PaymentStatusUpdate status_update = 2;
    PaymentCompleted payment_completed = 3;
    PaymentError payment_error = 4;
  }
}

// Payment initiation request
message InitiatePayment {
  string user_id = 1;
  string from_account_id = 2;
  string to_account_id = 3;
  double amount = 4;
  string currency = 5;
  string description = 6;
  string reference = 7;
  PaymentRail preferred_rail = 8;
  bool force_rail = 9;
}

// Payment update request
message UpdatePayment {
  string payment_id = 1;
  PaymentStatus new_status = 2;
  string reason = 3;
  map<string, string> metadata = 4;
}

// Payment cancellation request
message CancelPayment {
  string payment_id = 1;
  string reason = 2;
}

// Payment status inquiry
message GetPaymentStatus {
  string payment_id = 1;
  bool include_details = 2;
}

// Payment initiation response
message PaymentInitiated {
  string payment_id = 1;
  string session_id = 2;
  PaymentRail selected_rail = 3;
  double estimated_fee = 4;
  string estimated_time = 5;
  double fx_rate = 6;
  string message = 7;
  google.protobuf.Timestamp initiated_at = 8;
}

// Payment status update
message PaymentStatusUpdate {
  string payment_id = 1;
  PaymentStatus status = 2;
  string message = 3;
  map<string, string> metadata = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// Payment completion response
message PaymentCompleted {
  string payment_id = 1;
  double final_amount = 2;
  double final_fee = 3;
  string transaction_id = 4;
  string confirmation_number = 5;
  google.protobuf.Timestamp completed_at = 6;
  string message = 7;
}

// Payment error response
message PaymentError {
  string payment_id = 1;
  string error_code = 2;
  string error_message = 3;
  string error_details = 4;
  bool is_retryable = 5;
  google.protobuf.Timestamp error_at = 6;
} 